<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Example</title>

    <script>
        function F(fn) {
            let FN = fn;
            return FN;
        }

        function L(ln) {
            let LN = ln;
            return LN;
        }

        function Name() {
            let firstName = F("Vikas");
            let lastName = L("Choudhary");

            document.write(firstName + " " + lastName);
        }
    </script>
</head>
<body>

    <input type="button" value="Display" onclick="Name()">

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
</head>

<body>

<script>

    let a = new Array();
    let b = new Array(1, 2, 3, 4, 5);
    let c = [1, 2, 3, 4, 5];

    a[0] = "Saurabh Pal";
    a[1] = "Pal";
    a[2] = "032";

    // push()
    let L = c.push(6);
    console.log(L);

    // pop()
    let p = c.pop();
    console.log(p);

    // concat()
    let result = a.concat(b);
    console.log(result);

    console.log(a.length);

    // shift()
    c.shift();

    // unshift()
    c.unshift(1);

    // splice()
    c.splice(2, 2);
    c.splice(2, 0, 3);
    c.splice(2, 0, 6, 7, 8);

    // slice()
    let d = c.slice(1, 3);

    console.log(c);
    console.log(d);

</script>

</body>
</html>

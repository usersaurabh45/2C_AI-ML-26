<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Pattern</title>

    <script>
        function pattern() {
            let output = "";

            for (let i = 1; i <= 4; i++) {
                for (let j = 1; j <= i; j++) {
                    output += "* ";
                }
                output += "<br>";
            }

            document.getElementById("result").innerHTML = output;
        }
    </script>
</head>
<body>

    <input type="button" value="Display Pattern" onclick="pattern()">

    <div id="result"></div>

</body>
</html>
